wandb:
  resume: auto
  mode: offline
experiment:
  project: dllm-vsr
  name: lrs3_usr2huge_dream_v2
  output_dir: exp/runs/lrs3_usr2huge_dream_v2
  save_every: 250
  eval_every: 250
  generate_every: 250
  log_every: 20
  log_grad_norm_every: 100
  resume_from_checkpoint: false
  # warm-start from USR2 stage1 ckpt (oracle length, no PAD-in-loss).
  finetune_from: exp/runs/lrs3_usr2huge_dream/checkpoint-42000
model:
  # v2 convention: stage1 oracle-length + natural batch-pad PAD loss + no forced first-EOS masking.
  use_oracle_length: true
  force_first_eos_mask: false
  train_batch_pad_loss: true
  visual_encoder:
    type: usr2
    backbone: huge
    ckpt_path: ckpt/usr2/usr2_huge_pretrain.pth
    enc_dim: 1280
  adapter:
    kernel: 2
    stride: 2
    num_fc_layers: 2
    hidden_dim: 3584
  dllm:
    type: dream
    pretrained_model_path: Dream-org/Dream-v0-Instruct-7B
    tokenizer_path: Dream-org/Dream-v0-Instruct-7B
    hidden_size: 3584
  lora:
    enable: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: all-linear
  torch_dtype: bfloat16
  gradient_checkpointing: true
dataset:
  task_type: vsr
  backend: raw
  vsr:
    manifest_root: manifest/433h
    max_video_frames: 500
    modalities:
    - video
  raw_video:
    crop_size: 88
    normalize_mean: 0.421
    normalize_std: 0.165
    time_mask_window: 10
    time_mask_stride: 25
  dataloader:
    num_workers: 4
    pin_memory: true
    persistent_workers: true
optimizer:
  name: adamw
  params:
    learning_rate: 5.0e-5
    scale_lr: false
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.01
    epsilon: 1.0e-08
lr_scheduler:
  scheduler: cosine
  params:
    learning_rate: ${optimizer.params.learning_rate}
    warmup_steps: 200
    min_lr_scale: 0.1
training:
  gradient_accumulation_steps: 1
  noise_type: mask
  max_tokens: 2000
  max_batch_size: 32
  mixed_precision: bf16
  enable_tf32: true
  seed: 10086
  # 4000 step ≈ 2 epochs (warm-start). Same settings as the v2 convention.
  max_train_steps: 4000
  overfit_one_batch: false
  cond_dropout_prob: 0.1
  min_masking_rate: 0.0
  label_smoothing: 0.0
  max_grad_norm: 1
  guidance_scale: 1.5
  generation_timesteps: 12
eval:
  block_size: 1
  threshold: 0.9
  answer_len: 150
